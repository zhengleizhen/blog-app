<svg xmlns="http://www.w3.org/2000/svg" width="560" height="360" viewBox="0 0 560 360">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#f7df1e"/>
      <stop offset="100%" stop-color="#e8c818"/>
    </linearGradient>
    <linearGradient id="shine" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="rgba(255,255,255,0.2)"/>
      <stop offset="100%" stop-color="rgba(255,255,255,0)"/>
    </linearGradient>
  </defs>
  <rect width="560" height="360" fill="url(#bg)"/>
  <rect width="560" height="360" fill="url(#shine)"/>
  <!-- JS logo -->
  <rect x="180" y="80" width="200" height="180" rx="16" fill="#fff" opacity="0.9"/>
  <text x="280" y="200" text-anchor="middle" font-family="Arial, sans-serif" font-size="80" font-weight="bold" fill="#f7df1e">JS</text>
  <!-- brackets -->
  <text x="280" y="300" text-anchor="middle" font-family="monospace" font-size="20" fill="rgba(0,0,0,0.5)">{ async / await }</text>
  <!-- decorative elements -->
  <text x="60" y="50" font-family="monospace" font-size="14" fill="rgba(0,0,0,0.12)">Promise</text>
  <text x="420" y="60" font-family="monospace" font-size="14" fill="rgba(0,0,0,0.12)">.then()</text>
  <text x="80" y="320" font-family="monospace" font-size="14" fill="rgba(0,0,0,0.12)">Event Loop</text>
  <text x="380" y="330" font-family="monospace" font-size="14" fill="rgba(0,0,0,0.12)">fetch()</text>
</svg>
